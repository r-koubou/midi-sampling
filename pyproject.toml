[project]
name = "midi-sampling"
version = "0.1.0"
description = "Add your description here"
license = "MIT"
authors = [
    { name = "R-Koubou" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mido[ports-rtmidi]>=1.3.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "typer>=0.27.0",
]

[project.scripts]
midi-sampling = "midi_sampling.cli:app"
list-devices = "midi_sampling.devices.device_list_cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
