# ベロシティプロファイル定義(外部プリセット)
#
# - low / high / send は MIDIベロシティ(1〜127)。0 は Note Off 相当のため使用不可
# - low <= send <= high を満たすこと
# - レイヤー同士の重複・レイヤー間の空白は禁止
# - 全体で 1〜127 を完全に被覆すること
# - send のベロシティで実際に発音・録音し、low〜high の範囲へ割り当てる

schema_version: 1
kind: velocity_profile

layers:
  - low: 1
    high: 63
    send: 48

  - low: 64
    high: 127
    send: 112
